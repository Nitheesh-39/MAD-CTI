{% extends "base.html" %}

{% block title %}Register - MAD-CTI{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px; margin-top: 4rem; margin-bottom: 4rem;">
    <div class="card card-glass">
        <div class="card-header text-center">
            <h2 class="card-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h2>
            <p class="text-muted">Join MAD-CTI Platform</p>
        </div>

        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                        placeholder="Choose a username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                        placeholder="your.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        placeholder="Re-enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" style="margin-top: 1rem;">
                    Create Account
                </button>
            </form>
        </div>

        <div class="card-footer" style="justify-content: center;">
            <p class="text-muted">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="text-primary">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
